name: Auto Sync Fork

on:
  schedule:
    - cron: '0 0 */10 * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      workflows: write
      
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v5

      - name: Sync upstream changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. 配置 Git 用户信息
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 2. 添加上游仓库地址并获取更新
          git remote add upstream https://github.com/slobys/openclash-auto-installer.git
          git fetch upstream

          # 3. 切换到 main 分支并重置为上游最新状态
          git checkout main
          git reset --hard upstream/main

          # 4. 关键：还原本地的 .github/workflows 目录，避免触发 GitHub 的工作流修改拦截
          git checkout origin/main -- .github/workflows/ || true
          git commit -m "Preserve local workflow" || { echo "No changes to commit"; }

          # 5. 强制推送到你的 GitHub 仓库
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/hjz888/openclash-auto-installer.git main --force
